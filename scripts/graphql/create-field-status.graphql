mutation($ownerId: ID!) {
  createIssueField(input: {
    ownerId: $ownerId
    name: "Leveransestatus"
    description: "Fremdriftsstatus for leveransen"
    dataType: SINGLE_SELECT
    visibility: ALL
    options: [
      { name: "Levert", color: GREEN, priority: 0 }
      { name: "På plan", color: BLUE, priority: 1 }
      { name: "I faresonen", color: YELLOW, priority: 2 }
      { name: "Blokkert", color: RED, priority: 3 }
    ]
  }) {
    issueField {
      ... on IssueFieldSingleSelect {
        id
        name
        options {
          id
          name
        }
      }
    }
  }
}
