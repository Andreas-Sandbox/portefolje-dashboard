mutation($ownerId: ID!) {
  createIssueField(input: {
    ownerId: $ownerId
    name: "Kvartal"
    description: "Hvilket kvartal leveransen er committet til"
    dataType: SINGLE_SELECT
    visibility: ALL
    options: [
      { name: "Q3 2026", color: GRAY, priority: 0 }
      { name: "Q4 2026", color: GRAY, priority: 1 }
    ]
  }) {
    issueField {
      ... on IssueFieldSingleSelect {
        id
        name
        options {
          id
          name
        }
      }
    }
  }
}
